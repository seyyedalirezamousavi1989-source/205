name: Search engine tests

on:
  push:
    branches:
      - feature/search-overhaul-205
  pull_request:
    branches:
      - main
    paths:
      - "local_chat/search_engine.py"
      - "local_chat/search_plan.py"
      - "local_chat/search_providers.py"
      - "local_chat/settings.py"
      - "local_chat/server.py"
      - "local_chat/test_search*.py"
      - ".github/workflows/search-tests.yml"

jobs:
  search-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run isolated search tests
        run: python -m pytest -q local_chat/test_search_engine.py local_chat/test_search_plan.py local_chat/test_search_providers.py
